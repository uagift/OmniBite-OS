<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Verdana, sans-serif; background-color: #0c121d; color: #ffffff; padding: 24px; margin: 0; }
    .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; max-width: 600px; margin: 0 auto; }
    .header { font-size: 20px; font-weight: bold; color: #10b981; margin-bottom: 12px; border-bottom: 2px solid #1f2937; padding-bottom: 12px; }
    .detail { font-size: 14px; margin-bottom: 8px; color: #d1d5db; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">🍽️ Order Ready! Hot & Fresh - #{{orderNumber}}</div>
    <p class="detail">Hi {{customerName}},</p>
    <p class="detail">Good news! Your order at <strong>{{restaurantName}}</strong> is fully prepared and hot from the kitchen!</p>
    <p class="detail">A waiter is on their way to deliver it directly to <strong>Table {{tableNumber}}</strong>. Sit tight, food is arriving!</p>
    <p class="detail">Enjoy your meal!</p>
  </div>
</body>
</html>
